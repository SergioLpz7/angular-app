<div class="cont">
  <h2>QUEREMOS CONOCERTE</h2>

  <h3>Contacta con nosotros</h3>

  <section>
    <picture>
      <source
        media="(max-width: 600px)"
        srcset="./contactoMovil.jpg"
        class="img movil"
      />
      <source media="(min-width: 601px)" srcset="./contacto.jpg" class="img" />
      <img src="./contacto.jpg" alt="foto" />
    </picture>

    <form
      action="https://formsubmit.co/2458ab8e4279eb6221a79af35c8dec6c"
      method="POST"
    >
      <div class="nombre">
        <input type="text" name="name" placeholder="Nombre" required />
        <input type="text" name="surnames" placeholder="Apellidos" required />
      </div>

      <div class="correo">
        <input
          type="email"
          name="email"
          placeholder="Correo electrónico"
          required
        />
      </div>

      <div class="mensaje">
        <textarea
          name="message"
          placeholder="Mensaje"
          rows="10"
          required
        ></textarea>
      </div>

      <input type="hidden" name="_captcha" value="false" />

      <input
        type="hidden"
        name="_next"
        value="https://eiblittlerainbows.es/contacto"
      />

      <div class="privacidad">
        <label>
          Estoy de acuerdo con la política de privacidad
          <input type="checkbox" id="aceptar" name="aceptar_privacidad" required  
        /></label>
      </div>
      <button type="submit" class="btn">Enviar</button>
    </form>
  </section>
</div>

<div class="mapa">
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3042.978683136848!2d-3.982144423479709!3d40.2984322628301!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd41938db09fa2ff%3A0xa5ad785118f428ff!2sC.%20del%20Pino%20Canario%2C%204%2C%2028600%20Navalcarnero%2C%20Madrid!5e0!3m2!1ses!2ses!4v1726234783736!5m2!1ses!2ses"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <!-- loading="lazy" -->
</div>
